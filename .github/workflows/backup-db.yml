name: Fix Fecha 6 Valencia

on:
  push:
    paths:
      - '.github/workflows/backup-db.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    name: Fix Valencia and check Velez
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Wake up app
        run: |
          for i in 1 2 3 4 5; do
            curl -s -o /dev/null https://copa-fedex-sucesores.fly.dev/ && break || sleep 8
          done
          sleep 5

      - name: Fix Valencia ronda date and reassign Fecha 6
        run: |
          flyctl ssh console -a copa-fedex-sucesores -C "python3 -c \"
          import sqlite3,sys
          sys.path.insert(0,'/app')
          from src.ranking import recalcular_fecha
          DB='/data/torneo.db'
          c=sqlite3.connect(DB)
          c.row_factory=sqlite3.Row
          print('=== FIX: Valencia ronda 461 fecha 2026-03-28 -> 2026-03-27 ===')
          c.execute(\\\"UPDATE rondas SET fecha='2026-03-27' WHERE id=461\\\")
          c.commit()
          print('Ronda 461 fecha corregida a 2026-03-27')
          print()
          print('=== CHECK: Velez ronda 465 (2026-03-28 G:76) ===')
          print('Verificar en federacion si es realmente del sabado 28 o del viernes 27')
          print()
          print('=== REASSIGN Fecha 6 con sabado prevalece ===')
          SAB='2026-03-28'
          DOM='2026-03-29'
          rondas=c.execute(\\\"SELECT r.id,r.jugador_id,j.nombre,j.apellido,r.fecha,r.score_gross FROM rondas r JOIN jugadores j ON r.jugador_id=j.id WHERE r.fecha IN (?,?) AND r.club LIKE '%Manizales%' AND r.score_gross IS NOT NULL AND r.score_gross>=60 ORDER BY r.jugador_id,r.id\\\", (SAB,DOM)).fetchall()
          best={}
          for r in rondas:
              jid=r['jugador_id']
              if jid not in best: best[jid]=dict(r)
              elif r['fecha']==SAB: best[jid]=dict(r)
          print(f'{len(best)} players:')
          for jid,r in sorted(best.items()): print(f'  {r[\\\"nombre\\\"]} {r[\\\"apellido\\\"]} | {r[\\\"fecha\\\"]} | G:{r[\\\"score_gross\\\"]}')
          c.execute('DELETE FROM resultados_fecha WHERE fecha_torneo_id=11')
          for jid,r in best.items(): c.execute('INSERT INTO resultados_fecha(fecha_torneo_id,jugador_id,ronda_id,score_gross) VALUES(11,?,?,?)',(11,jid,r['id'],r['score_gross']))
          c.execute('UPDATE fechas_torneo SET num_jugadores=?,valida=? WHERE id=11',(len(best),len(best)>=2))
          c.commit()
          recalcular_fecha(DB,11)
          print()
          print('=== FECHA 6 FINAL ===')
          for r in c.execute('SELECT rf.posicion,j.nombre,j.apellido,rf.score_gross,rf.handicap_aplicado,rf.score_neto,rf.puntos,rr.fecha as ronda_fecha FROM resultados_fecha rf JOIN jugadores j ON rf.jugador_id=j.id LEFT JOIN rondas rr ON rf.ronda_id=rr.id WHERE rf.fecha_torneo_id=11 ORDER BY rf.posicion').fetchall():
              dia='Sab' if r['ronda_fecha']=='2026-03-28' else 'Dom'
              print(f'  {r[\\\"posicion\\\"]:>2} {r[\\\"nombre\\\"]} {r[\\\"apellido\\\"]} G:{r[\\\"score_gross\\\"]} HCP:{r[\\\"handicap_aplicado\\\"]} N:{r[\\\"score_neto\\\"]} Pts:{r[\\\"puntos\\\"]} {dia}')
          \""
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Download and backup
        run: |
          flyctl ssh console -a copa-fedex-sucesores -C "cat /data/torneo.db" > data/torneo_prod.db
          python3 << 'PYEOF'
          import sqlite3, json
          conn = sqlite3.connect('data/torneo_prod.db')
          conn.row_factory = sqlite3.Row
          for tabla in ['jugadores', 'rondas', 'fechas_torneo', 'resultados_fecha', 'tabla_puntos']:
              rows = [dict(r) for r in conn.execute(f'SELECT * FROM {tabla}').fetchall()]
              with open(f'data/backup/{tabla}.json', 'w') as f:
                  json.dump(rows, f, indent=2, ensure_ascii=False)
              print(f'{tabla}: {len(rows)}')
          conn.close()
          PYEOF
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Commit backups
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git pull --rebase origin main || true
          git add data/backup/
          git diff --staged --quiet && echo "No changes" || (
            git commit -m "Fix Valencia: ronda 28mar es realmente 27mar (jueves), usar domingo 29 G:77"
            git push origin main
          )
