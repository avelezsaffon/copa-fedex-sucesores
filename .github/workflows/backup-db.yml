name: Fix Gonzalez HCP

on:
  push:
    paths:
      - '.github/workflows/backup-db.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    name: Fix Gonzalez HCP and recalculate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Wake up app
        run: |
          for i in 1 2 3 4 5; do
            curl -s -o /dev/null https://copa-fedex-sucesores.fly.dev/ && break || sleep 8
          done
          sleep 5

      - name: Fix Gonzalez HCP to 2 and recalculate
        run: |
          flyctl ssh console -a copa-fedex-sucesores -C "python3 -c \"
          import sqlite3,sys
          sys.path.insert(0,'/app')
          from src.ranking import recalcular_fecha
          DB='/data/torneo.db'
          c=sqlite3.connect(DB)
          c.row_factory=sqlite3.Row
          rf=c.execute('SELECT ronda_id FROM resultados_fecha WHERE fecha_torneo_id=11 AND jugador_id=11').fetchone()
          if rf and rf['ronda_id']:
              c.execute('UPDATE rondas SET handicap_cancha=2 WHERE id=?',(rf['ronda_id'],))
              c.commit()
              print(f'Fixed ronda {rf[\\\"ronda_id\\\"]} handicap_cancha=2')
          else:
              print('No ronda found, updating resultados directly')
              c.execute('UPDATE resultados_fecha SET handicap_aplicado=2,score_neto=score_gross-2 WHERE fecha_torneo_id=11 AND jugador_id=11')
              c.commit()
          recalcular_fecha(DB,11)
          print('FECHA 6 RECALCULATED:')
          for r in c.execute('SELECT rf.posicion,j.nombre,j.apellido,rf.score_gross,rf.handicap_aplicado,rf.score_neto,rf.puntos FROM resultados_fecha rf JOIN jugadores j ON rf.jugador_id=j.id WHERE rf.fecha_torneo_id=11 ORDER BY rf.posicion').fetchall(): print(f'  {r[0]:>2} {r[1]} {r[2]:<25} G:{r[3]} HCP:{r[4]} N:{r[5]} Pts:{r[6]}')
          \""
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Download and backup
        run: |
          flyctl ssh console -a copa-fedex-sucesores -C "cat /data/torneo.db" > data/torneo_prod.db
          python3 << 'PYEOF'
          import sqlite3, json
          conn = sqlite3.connect('data/torneo_prod.db')
          conn.row_factory = sqlite3.Row
          for tabla in ['jugadores', 'rondas', 'fechas_torneo', 'resultados_fecha', 'tabla_puntos']:
              rows = [dict(r) for r in conn.execute(f'SELECT * FROM {tabla}').fetchall()]
              with open(f'data/backup/{tabla}.json', 'w') as f:
                  json.dump(rows, f, indent=2, ensure_ascii=False)
              print(f'{tabla}: {len(rows)}')
          conn.close()
          PYEOF
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Commit backups
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git pull --rebase origin main || true
          git add data/backup/
          git diff --staged --quiet && echo "No changes" || (
            git commit -m "Fix Gonzalez Ossa HCP=2 en Fecha 6 (era 1 calculado, federacion tenia 2)"
            git push origin main
          )
