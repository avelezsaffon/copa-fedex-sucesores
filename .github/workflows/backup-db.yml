name: Check federation raw dates

on:
  push:
    paths:
      - '.github/workflows/backup-db.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    name: Query federation directly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Wake up app
        run: |
          for i in 1 2 3 4 5; do
            curl -s -o /dev/null https://copa-fedex-sucesores.fly.dev/ && break || sleep 8
          done
          sleep 5

      - name: Check Perez Quintero raw federation data
        run: |
          flyctl ssh console -a copa-fedex-sucesores -C "python3 -c \"
          import sys;sys.path.insert(0,'/app')
          from src.fedegolf_collector import FedegolfScoresCollector
          from src.sync import normalizar_fecha
          c=FedegolfScoresCollector()
          scores=c.get_player_scores('0035x000032ofQxAAI')
          print('Perez Quintero - Federation raw:')
          for s in scores[:15]:
              raw=s.get('fecha','')
              norm=normalizar_fecha(raw)
              print(f'  raw={raw} norm={norm} club={s.get(\"club\",\"\")} scores={s.get(\"scores\",\"\")} tarjeta={s.get(\"tarjeta_id\",\"\")}')
          \""
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Check Valencia raw federation data
        run: |
          flyctl ssh console -a copa-fedex-sucesores -C "python3 -c \"
          import sys;sys.path.insert(0,'/app')
          from src.fedegolf_collector import FedegolfScoresCollector
          from src.sync import normalizar_fecha
          c=FedegolfScoresCollector()
          scores=c.get_player_scores('0035x000032ocgrAAA')
          print('Valencia Hoyos - Federation raw:')
          for s in scores[:15]:
              raw=s.get('fecha','')
              norm=normalizar_fecha(raw)
              print(f'  raw={raw} norm={norm} club={s.get(\"club\",\"\")} scores={s.get(\"scores\",\"\")} tarjeta={s.get(\"tarjeta_id\",\"\")}')
          \""
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Check Zuluaga raw federation data
        run: |
          flyctl ssh console -a copa-fedex-sucesores -C "python3 -c \"
          import sys;sys.path.insert(0,'/app')
          from src.fedegolf_collector import FedegolfScoresCollector
          from src.sync import normalizar_fecha
          c=FedegolfScoresCollector()
          scores=c.get_player_scores('0035x000032ocvTAAQ')
          print('Zuluaga Ramirez - Federation raw:')
          for s in scores[:15]:
              raw=s.get('fecha','')
              norm=normalizar_fecha(raw)
              print(f'  raw={raw} norm={norm} club={s.get(\"club\",\"\")} scores={s.get(\"scores\",\"\")} tarjeta={s.get(\"tarjeta_id\",\"\")}')
          \""
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Update existing tarjeta dates from federation
        run: |
          flyctl ssh console -a copa-fedex-sucesores -C "python3 -c \"
          import sqlite3,sys,time
          sys.path.insert(0,'/app')
          from src.fedegolf_collector import FedegolfScoresCollector
          from src.sync import normalizar_fecha
          c=sqlite3.connect('/data/torneo.db')
          collector=FedegolfScoresCollector()
          jugadores=c.execute('SELECT id,salesforce_id,nombre,apellido FROM jugadores WHERE salesforce_id IS NOT NULL ORDER BY id').fetchall()
          total_fixes=0
          for j in jugadores:
              try:
                  fed=collector.get_player_scores(j[1])
              except: continue
              if not fed: continue
              fm={}
              for s in fed:
                  t=s.get('tarjeta_id')
                  if t: fm[t]=normalizar_fecha(s.get('fecha',''))
              db=c.execute('SELECT id,fecha,tarjeta_id,score_gross FROM rondas WHERE jugador_id=? AND tarjeta_id IS NOT NULL',(j[0],)).fetchall()
              for r in db:
                  if r[2] in fm and fm[r[2]]!=r[1]:
                      print(f'FIX {j[2]} {j[3]}: ronda {r[0]} G:{r[3]} {r[1]}->{fm[r[2]]}')
                      c.execute('UPDATE rondas SET fecha=? WHERE id=?',(fm[r[2]],r[0]))
                      total_fixes+=1
              time.sleep(0.3)
          c.commit()
          print(f'Total fixes: {total_fixes}')
          \""
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Show March 21 after fix
        run: |
          flyctl ssh console -a copa-fedex-sucesores -C "python3 -c \"
          import sqlite3
          c=sqlite3.connect('/data/torneo.db')
          print('Rondas marzo 21 Manizales:')
          for r in c.execute(\\\"SELECT r.id,j.nombre,j.apellido,r.score_gross,r.handicap_cancha,r.tarjeta_id FROM rondas r JOIN jugadores j ON r.jugador_id=j.id WHERE r.fecha='2026-03-21' AND r.club LIKE '%Manizales%' ORDER BY r.score_gross\\\").fetchall():
              print(f'  {r[1]} {r[2]}: G:{r[3]} HCP:{r[4]} t:{r[5]}')
          \""
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Download and backup
        run: |
          flyctl ssh console -a copa-fedex-sucesores -C "cat /data/torneo.db" > data/torneo_prod.db
          python3 << 'PYEOF'
          import sqlite3, json
          conn = sqlite3.connect('data/torneo_prod.db')
          conn.row_factory = sqlite3.Row
          for tabla in ['jugadores', 'rondas', 'fechas_torneo', 'resultados_fecha', 'tabla_puntos']:
              rows = [dict(r) for r in conn.execute(f'SELECT * FROM {tabla}').fetchall()]
              with open(f'data/backup/{tabla}.json', 'w') as f:
                  json.dump(rows, f, indent=2, ensure_ascii=False)
              print(f'{tabla}: {len(rows)}')
          conn.close()
          PYEOF
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Commit
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git pull --rebase origin main || true
          git add data/backup/
          git diff --staged --quiet && echo "No changes" || (
            git commit -m "Deep check: raw federation dates + update existing tarjetas"
            git push origin main
          )
