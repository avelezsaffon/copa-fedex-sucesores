name: Fix Fecha 6 handicaps from federation

on:
  push:
    paths:
      - '.github/workflows/backup-db.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    name: Get federation handicaps and recalculate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Wake up app
        run: |
          for i in 1 2 3 4 5; do
            curl -s -o /dev/null https://copa-fedex-sucesores.fly.dev/ && break || sleep 8
          done
          sleep 5

      - name: Get handicaps from federation for Fecha 6 rounds
        run: |
          TARJETAS=$(flyctl ssh console -a copa-fedex-sucesores -C "python3 -c \"
          import sqlite3
          c=sqlite3.connect('/data/torneo.db')
          for r in c.execute('SELECT r.id,r.tarjeta_id,r.jugador_id,j.nombre,j.apellido FROM rondas r JOIN jugadores j ON r.jugador_id=j.id JOIN resultados_fecha rf ON r.id=rf.ronda_id WHERE rf.fecha_torneo_id=11 AND r.handicap_cancha IS NULL AND r.tarjeta_id IS NOT NULL').fetchall(): print(f'{r[0]}|{r[1]}|{r[2]}|{r[3]} {r[4]}')
          \"")
          echo "Rounds needing handicap:"
          echo "$TARJETAS"
          echo ""
          while IFS='|' read -r RID TID JID NAME; do
            if [ -n "$RID" ] && [ -n "$TID" ]; then
              echo "Getting HCP for $NAME (ronda $RID, tarjeta $TID)..."
              flyctl ssh console -a copa-fedex-sucesores -C "python3 -c \"
          import sys;sys.path.insert(0,'/app')
          from src.fedegolf_collector import FedegolfScoresCollector
          import sqlite3
          c=FedegolfScoresCollector()
          d=c.get_scorecard_detail('$TID')
          if d and d.get('handicap_cancha') is not None:
              conn=sqlite3.connect('/data/torneo.db')
              conn.execute('UPDATE rondas SET handicap_cancha=?,indice_al_momento=? WHERE id=?',(d['handicap_cancha'],d.get('indice_al_momento'),$RID))
              conn.commit()
              print(f'OK hcp={d[\\\"handicap_cancha\\\"]} indice={d.get(\\\"indice_al_momento\\\")}')
          else: print(f'SKIP: {d}')
          \"" || echo "  Error"
              sleep 1
            fi
          done <<< "$TARJETAS"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Recalculate Fecha 6 and show results
        run: |
          flyctl ssh console -a copa-fedex-sucesores -C "python3 -c \"
          import sys;sys.path.insert(0,'/app')
          from src.ranking import recalcular_fecha
          recalcular_fecha('/data/torneo.db',11)
          import sqlite3
          c=sqlite3.connect('/data/torneo.db')
          c.row_factory=sqlite3.Row
          print('FECHA 6 FINAL:')
          for r in c.execute('SELECT rf.posicion,j.nombre,j.apellido,rf.score_gross,rf.handicap_aplicado,rf.score_neto,rf.puntos,rr.handicap_cancha FROM resultados_fecha rf JOIN jugadores j ON rf.jugador_id=j.id LEFT JOIN rondas rr ON rf.ronda_id=rr.id WHERE rf.fecha_torneo_id=11 ORDER BY rf.posicion').fetchall():
              src='FED' if r['handicap_cancha'] is not None else 'CALC'
              print(f'  {r[\\\"posicion\\\"]} {r[\\\"nombre\\\"]} {r[\\\"apellido\\\"]} G:{r[\\\"score_gross\\\"]} HCP:{r[\\\"handicap_aplicado\\\"]} N:{r[\\\"score_neto\\\"]} Pts:{r[\\\"puntos\\\"]} [{src}]')
          \""
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Download and backup
        run: |
          flyctl ssh console -a copa-fedex-sucesores -C "cat /data/torneo.db" > data/torneo_prod.db
          python3 << 'PYEOF'
          import sqlite3, json
          conn = sqlite3.connect('data/torneo_prod.db')
          conn.row_factory = sqlite3.Row
          for tabla in ['jugadores', 'rondas', 'fechas_torneo', 'resultados_fecha', 'tabla_puntos']:
              rows = [dict(r) for r in conn.execute(f'SELECT * FROM {tabla}').fetchall()]
              with open(f'data/backup/{tabla}.json', 'w') as f:
                  json.dump(rows, f, indent=2, ensure_ascii=False)
              print(f'{tabla}: {len(rows)}')
          conn.close()
          PYEOF
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Commit backups
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git pull --rebase origin main || true
          git add data/backup/
          git diff --staged --quiet && echo "No changes" || (
            git commit -m "Fix Fecha 6: handicaps de la federacion (no calculados)"
            git push origin main
          )
