name: Fix Fecha 5 - Add missing players

on:
  push:
    paths:
      - '.github/workflows/backup-db.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    name: Fix and verify Fecha 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Wake up app
        run: |
          for i in 1 2 3 4 5; do
            curl -s -o /dev/null https://copa-fedex-sucesores.fly.dev/ && break || sleep 8
          done
          sleep 5

      - name: Check current state of production DB
        run: |
          flyctl ssh console -a copa-fedex-sucesores -C "python3 -c \"
          import sqlite3
          c=sqlite3.connect('/data/torneo.db')
          print('FECHAS:')
          for r in c.execute('SELECT id,fecha,num_jugadores,valida FROM fechas_torneo WHERE num_jugadores>0').fetchall(): print(r)
          print()
          print('FECHA 9 RESULTS:')
          for r in c.execute('SELECT rf.jugador_id,j.nombre,j.apellido,rf.score_gross,rf.handicap_aplicado,rf.score_neto,rf.posicion,rf.puntos FROM resultados_fecha rf JOIN jugadores j ON rf.jugador_id=j.id WHERE rf.fecha_torneo_id=9 ORDER BY rf.posicion').fetchall(): print(r)
          print()
          print('RONDAS MAR 21-22 MANIZALES:')
          for r in c.execute(\\\"SELECT r.id,r.jugador_id,j.nombre,j.apellido,r.fecha,r.score_gross,r.handicap_cancha,r.tarjeta_id FROM rondas r JOIN jugadores j ON r.jugador_id=j.id WHERE r.fecha IN ('2026-03-21','2026-03-22') AND r.club LIKE '%Manizales%' AND r.score_gross>=60 ORDER BY r.jugador_id,r.id\\\").fetchall(): print(r)
          \""
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Fix - assign all players and recalculate
        run: |
          flyctl ssh console -a copa-fedex-sucesores -C "python3 -c \"
          import sqlite3,sys
          sys.path.insert(0,'/app')
          from src.ranking import recalcular_fecha
          DB='/data/torneo.db'
          c=sqlite3.connect(DB)
          c.row_factory=sqlite3.Row
          rondas=c.execute(\\\"SELECT r.id,r.jugador_id,r.fecha,r.score_gross FROM rondas r WHERE r.fecha IN ('2026-03-21','2026-03-22') AND r.club LIKE '%Manizales%' AND r.score_gross IS NOT NULL AND r.score_gross>=60 ORDER BY r.jugador_id,r.fecha\\\").fetchall()
          best={}
          for r in rondas:
              jid=r['jugador_id']
              if jid not in best: best[jid]=dict(r)
              elif r['fecha']=='2026-03-21': best[jid]=dict(r)
          print(f'Players: {len(best)}')
          for jid,r in sorted(best.items()): print(f'  jug {jid}: ronda {r[\\\"id\\\"]} G:{r[\\\"score_gross\\\"]} ({r[\\\"fecha\\\"]})')
          c.execute('DELETE FROM resultados_fecha WHERE fecha_torneo_id=9')
          for jid,r in best.items(): c.execute('INSERT INTO resultados_fecha(fecha_torneo_id,jugador_id,ronda_id,score_gross) VALUES(9,?,?,?)',(jid,r['id'],r['score_gross']))
          c.execute('UPDATE fechas_torneo SET num_jugadores=?,valida=? WHERE id=9',(len(best),len(best)>=2))
          c.commit()
          recalcular_fecha(DB,9)
          print('Recalculated!')
          for r in c.execute('SELECT rf.posicion,j.nombre,j.apellido,rf.score_gross,rf.handicap_aplicado,rf.score_neto,rf.puntos FROM resultados_fecha rf JOIN jugadores j ON rf.jugador_id=j.id WHERE rf.fecha_torneo_id=9 ORDER BY rf.posicion').fetchall(): print(f'  {r[0]} {r[1]} {r[2]} G:{r[3]} HCP:{r[4]} N:{r[5]} Pts:{r[6]}')
          \""
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Download and backup
        run: |
          flyctl ssh console -a copa-fedex-sucesores -C "cat /data/torneo.db" > data/torneo_prod.db
          python3 << 'PYEOF'
          import sqlite3, json
          conn = sqlite3.connect('data/torneo_prod.db')
          conn.row_factory = sqlite3.Row
          for tabla in ['jugadores', 'rondas', 'fechas_torneo', 'resultados_fecha', 'tabla_puntos']:
              rows = [dict(r) for r in conn.execute(f'SELECT * FROM {tabla}').fetchall()]
              with open(f'data/backup/{tabla}.json', 'w') as f:
                  json.dump(rows, f, indent=2, ensure_ascii=False)
              print(f'{tabla}: {len(rows)}')
          conn.close()
          PYEOF
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Commit backups
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git pull --rebase origin main || true
          git add data/backup/
          git diff --staged --quiet && echo "No changes" || (
            git commit -m "Fix Fecha 5: include all 11 players + recalculate"
            git push origin main
          )
