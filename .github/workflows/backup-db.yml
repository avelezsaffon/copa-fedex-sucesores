name: Reassign Fecha 6 post-audit

on:
  push:
    paths:
      - '.github/workflows/backup-db.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    name: Reassign and backup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Wake up app
        run: |
          for i in 1 2 3 4 5; do
            curl -s -o /dev/null https://copa-fedex-sucesores.fly.dev/ && break || sleep 8
          done
          sleep 5

      - name: Show corrected dates
        run: |
          flyctl ssh console -a copa-fedex-sucesores -C "python3 -c \"
          import sqlite3
          c=sqlite3.connect('/data/torneo.db')
          print('Rondas mar 27-29 Manizales:')
          for r in c.execute(\\\"SELECT r.id,r.jugador_id,j.nombre,j.apellido,r.fecha,r.score_gross FROM rondas r JOIN jugadores j ON r.jugador_id=j.id WHERE r.fecha BETWEEN '2026-03-27' AND '2026-03-29' AND r.club LIKE '%Manizales%' AND r.score_gross>=60 ORDER BY r.fecha,r.jugador_id\\\").fetchall():
              print(f'  {r[4]} jug:{r[1]} {r[2]} {r[3]} G:{r[5]} id:{r[0]}')
          \""
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Reassign Fecha 6
        run: |
          flyctl ssh console -a copa-fedex-sucesores -C "python3 -c \"
          import sqlite3,sys
          sys.path.insert(0,'/app')
          from src.ranking import recalcular_fecha
          DB='/data/torneo.db'
          c=sqlite3.connect(DB)
          r=c.execute(\\\"SELECT r.id,r.jugador_id,r.fecha,r.score_gross FROM rondas r WHERE r.fecha IN ('2026-03-28','2026-03-29') AND r.club LIKE '%Manizales%' AND r.score_gross IS NOT NULL AND r.score_gross>=60 ORDER BY r.jugador_id,r.id\\\").fetchall()
          b={}
          for x in r:
              j=x[1]
              if j not in b: b[j]={'id':x[0],'f':x[2],'g':x[3]}
              elif x[2]=='2026-03-28': b[j]={'id':x[0],'f':x[2],'g':x[3]}
          c.execute('DELETE FROM resultados_fecha WHERE fecha_torneo_id=11')
          for j,v in b.items(): c.execute('INSERT INTO resultados_fecha(fecha_torneo_id,jugador_id,ronda_id,score_gross) VALUES(11,?,?,?)',(j,v['id'],v['g']))
          c.execute('UPDATE fechas_torneo SET num_jugadores=?,valida=? WHERE id=11',(len(b),len(b)>=2))
          c.commit()
          recalcular_fecha(DB,11)
          for x in c.execute('SELECT rf.posicion,j.nombre,j.apellido,rf.score_gross,rf.handicap_aplicado,rf.score_neto,rf.puntos FROM resultados_fecha rf JOIN jugadores j ON rf.jugador_id=j.id WHERE rf.fecha_torneo_id=11 ORDER BY rf.posicion').fetchall(): print(f'{x[0]:>2} {x[1]} {x[2]} G:{x[3]} HCP:{x[4]} N:{x[5]} Pts:{x[6]}')
          \""
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Download and backup
        run: |
          flyctl ssh console -a copa-fedex-sucesores -C "cat /data/torneo.db" > data/torneo_prod.db
          python3 << 'PYEOF'
          import sqlite3, json
          conn = sqlite3.connect('data/torneo_prod.db')
          conn.row_factory = sqlite3.Row
          for tabla in ['jugadores', 'rondas', 'fechas_torneo', 'resultados_fecha', 'tabla_puntos']:
              rows = [dict(r) for r in conn.execute(f'SELECT * FROM {tabla}').fetchall()]
              with open(f'data/backup/{tabla}.json', 'w') as f:
                  json.dump(rows, f, indent=2, ensure_ascii=False)
              print(f'{tabla}: {len(rows)}')
          conn.close()
          PYEOF
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Commit backups
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git pull --rebase origin main || true
          git add data/backup/
          git diff --staged --quiet && echo "No changes" || (
            git commit -m "Post-audit: reassign Fecha 6 with corrected dates + backup"
            git push origin main
          )
