name: Audit rondas vs federacion

on:
  push:
    paths:
      - '.github/workflows/backup-db.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    name: Audit all recent rounds against federation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Wake up app
        run: |
          for i in 1 2 3 4 5; do
            curl -s -o /dev/null https://copa-fedex-sucesores.fly.dev/ && break || sleep 8
          done
          sleep 5

      - name: Audit all players rounds vs federation
        run: |
          flyctl ssh console -a copa-fedex-sucesores -C "python3 -c \"
          import sqlite3,sys,time
          sys.path.insert(0,'/app')
          from src.fedegolf_collector import FedegolfScoresCollector
          from src.sync import normalizar_fecha
          DB='/data/torneo.db'
          c=sqlite3.connect(DB)
          c.row_factory=sqlite3.Row
          collector=FedegolfScoresCollector()
          jugadores=c.execute('SELECT id,nombre,apellido,salesforce_id FROM jugadores ORDER BY apellido').fetchall()
          fixes=[]
          for j in jugadores:
              if not j['salesforce_id']: continue
              print(f'Checking {j[\\\"nombre\\\"]} {j[\\\"apellido\\\"]}...')
              try:
                  fed_scores=collector.get_player_scores(j['salesforce_id'])
              except: 
                  print('  ERROR fetching')
                  continue
              if not fed_scores: 
                  print('  No scores')
                  continue
              fed_map={}
              for s in fed_scores:
                  tid=s.get('tarjeta_id')
                  if tid:
                      fecha_fed=normalizar_fecha(s.get('fecha',''))
                      fed_map[tid]={'fecha':fecha_fed,'scores':s.get('scores',''),'club':s.get('club','')}
              db_rondas=c.execute('SELECT id,fecha,tarjeta_id,score_gross,club FROM rondas WHERE jugador_id=? AND fecha>=\\\"2026-03-01\\\" AND tarjeta_id IS NOT NULL',(j['id'],)).fetchall()
              for r in db_rondas:
                  tid=r['tarjeta_id']
                  if tid in fed_map:
                      fed=fed_map[tid]
                      if fed['fecha']!=r['fecha']:
                          print(f'  MISMATCH ronda {r[\\\"id\\\"]}: DB={r[\\\"fecha\\\"]} FED={fed[\\\"fecha\\\"]} G:{r[\\\"score_gross\\\"]} tarjeta={tid}')
                          fixes.append((r['id'],r['fecha'],fed['fecha'],j['nombre'],j['apellido'],r['score_gross']))
                          c.execute('UPDATE rondas SET fecha=? WHERE id=?',(fed['fecha'],r['id']))
              time.sleep(0.5)
          if fixes:
              c.commit()
              print()
              print(f'=== {len(fixes)} FECHAS CORREGIDAS ===')
              for rid,old,new,nom,ape,g in fixes:
                  print(f'  {nom} {ape}: ronda {rid} G:{g} {old}->{new}')
          else:
              print()
              print('No date mismatches found')
          print()
          print('=== RECALCULATING FECHA 5 AND 6 ===')
          from src.ranking import recalcular_fecha
          recalcular_fecha(DB,9)
          recalcular_fecha(DB,11)
          print('Done')
          print()
          print('=== FECHA 6 RESULTS ===')
          for r in c.execute('SELECT rf.posicion,j.nombre,j.apellido,rf.score_gross,rf.handicap_aplicado,rf.score_neto,rf.puntos,rr.fecha FROM resultados_fecha rf JOIN jugadores j ON rf.jugador_id=j.id LEFT JOIN rondas rr ON rf.ronda_id=rr.id WHERE rf.fecha_torneo_id=11 ORDER BY rf.posicion').fetchall():
              print(f'  {r[0]:>2} {r[1]} {r[2]} G:{r[3]} HCP:{r[4]} N:{r[5]} Pts:{r[6]} ({r[7]})')
          \""
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Download and backup
        run: |
          flyctl ssh console -a copa-fedex-sucesores -C "cat /data/torneo.db" > data/torneo_prod.db
          python3 << 'PYEOF'
          import sqlite3, json
          conn = sqlite3.connect('data/torneo_prod.db')
          conn.row_factory = sqlite3.Row
          for tabla in ['jugadores', 'rondas', 'fechas_torneo', 'resultados_fecha', 'tabla_puntos']:
              rows = [dict(r) for r in conn.execute(f'SELECT * FROM {tabla}').fetchall()]
              with open(f'data/backup/{tabla}.json', 'w') as f:
                  json.dump(rows, f, indent=2, ensure_ascii=False)
              print(f'{tabla}: {len(rows)}')
          conn.close()
          PYEOF
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Commit backups
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git pull --rebase origin main || true
          git add data/backup/
          git diff --staged --quiet && echo "No changes" || (
            git commit -m "Audit: fix date mismatches between DB and federation for all players"
            git push origin main
          )
