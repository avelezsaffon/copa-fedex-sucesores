name: Dump raw federation HTML

on:
  push:
    paths:
      - '.github/workflows/backup-db.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dump:
    name: Dump raw federation data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Wake up app
        run: |
          for i in 1 2 3 4 5; do
            curl -s -o /dev/null https://copa-fedex-sucesores.fly.dev/ && break || sleep 8
          done
          sleep 5

      - name: Dump raw HTML and parsed data for Perez
        run: |
          flyctl ssh console -a copa-fedex-sucesores -C "python3 /app/dump_fed.py" > dump_perez.txt 2>&1 || true
          cat dump_perez.txt || echo "empty"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Upload dump as artifact
        uses: actions/upload-artifact@v4
        with:
          name: perez-dump
          path: dump_perez.txt

      - name: Commit dump
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git pull --rebase origin main || true
          git add dump_perez.txt
          git diff --staged --quiet && echo "No changes" || (
            git commit -m "Dump raw federation data for debugging"
            git push origin main
          )
