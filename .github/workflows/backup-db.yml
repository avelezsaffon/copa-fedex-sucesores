name: Liquidar Fecha 6

on:
  push:
    paths:
      - '.github/workflows/backup-db.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  liquidar:
    name: Liquidar Fecha 6 (2026-03-28)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Wake up app
        run: |
          for i in 1 2 3 4 5; do
            curl -s -o /dev/null https://copa-fedex-sucesores.fly.dev/ && break || sleep 8
          done
          sleep 5

      - name: Sync all players
        run: |
          echo "Syncing..."
          curl -s -X POST https://copa-fedex-sucesores.fly.dev/api/sync/all --max-time 300 | python3 -m json.tool 2>/dev/null || true

      - name: Assign players and recalculate Fecha 6
        run: |
          flyctl ssh console -a copa-fedex-sucesores -C "python3 -c \"
          import sqlite3,sys
          sys.path.insert(0,'/app')
          from src.ranking import recalcular_fecha
          DB='/data/torneo.db'
          c=sqlite3.connect(DB)
          c.row_factory=sqlite3.Row
          SAB='2026-03-28'
          DOM='2026-03-29'
          rondas=c.execute(\\\"SELECT r.id,r.jugador_id,r.fecha,r.score_gross FROM rondas r WHERE r.fecha IN (?,?) AND r.club LIKE '%Manizales%' AND r.score_gross IS NOT NULL AND r.score_gross>=60 ORDER BY r.jugador_id,r.fecha\\\", (SAB,DOM)).fetchall()
          print(f'Found {len(rondas)} rounds for {SAB}/{DOM}')
          best={}
          for r in rondas:
              jid=r['jugador_id']
              if jid not in best: best[jid]=dict(r)
              elif r['fecha']==SAB: best[jid]=dict(r)
          print(f'{len(best)} players')
          for jid,r in sorted(best.items()): print(f'  jug {jid}: ronda {r[\\\"id\\\"]} G:{r[\\\"score_gross\\\"]} ({r[\\\"fecha\\\"]})')
          fid=11
          c.execute('DELETE FROM resultados_fecha WHERE fecha_torneo_id=?',(fid,))
          for jid,r in best.items(): c.execute('INSERT INTO resultados_fecha(fecha_torneo_id,jugador_id,ronda_id,score_gross) VALUES(?,?,?,?)',(fid,jid,r['id'],r['score_gross']))
          c.execute('UPDATE fechas_torneo SET num_jugadores=?,valida=? WHERE id=?',(len(best),len(best)>=2,fid))
          c.commit()
          recalcular_fecha(DB,fid)
          print('Recalculated!')
          for r in c.execute('SELECT rf.posicion,j.nombre,j.apellido,rf.score_gross,rf.handicap_aplicado,rf.score_neto,rf.puntos FROM resultados_fecha rf JOIN jugadores j ON rf.jugador_id=j.id WHERE rf.fecha_torneo_id=? ORDER BY rf.posicion',(fid,)).fetchall(): print(f'  {r[0]} {r[1]} {r[2]} G:{r[3]} HCP:{r[4]} N:{r[5]} Pts:{r[6]}')
          \""
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Get handicaps from federation
        run: |
          TARJETAS=$(flyctl ssh console -a copa-fedex-sucesores -C "python3 -c \"
          import sqlite3
          c=sqlite3.connect('/data/torneo.db')
          for r in c.execute(\\\"SELECT r.id,r.tarjeta_id FROM rondas r JOIN resultados_fecha rf ON r.id=rf.ronda_id WHERE rf.fecha_torneo_id=11 AND r.handicap_cancha IS NULL AND r.tarjeta_id IS NOT NULL\\\").fetchall(): print(f'{r[0]}|{r[1]}')
          \"")
          echo "Tarjetas: $TARJETAS"
          while IFS='|' read -r RID TID; do
            if [ -n "$RID" ] && [ -n "$TID" ]; then
              flyctl ssh console -a copa-fedex-sucesores -C "python3 -c \"
          import sys;sys.path.insert(0,'/app')
          from src.fedegolf_collector import FedegolfScoresCollector
          import sqlite3
          c=FedegolfScoresCollector()
          d=c.get_scorecard_detail('$TID')
          if d and d.get('handicap_cancha') is not None:
              conn=sqlite3.connect('/data/torneo.db')
              conn.execute('UPDATE rondas SET handicap_cancha=?,indice_al_momento=? WHERE id=?',(d['handicap_cancha'],d.get('indice_al_momento'),$RID))
              conn.commit()
              print(f'OK: ronda=$RID hcp={d[\\\"handicap_cancha\\\"]}')
          else: print(f'SKIP: {d}')
          \"" || echo "Error $TID"
              sleep 1
            fi
          done <<< "$TARJETAS"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Recalculate with federation handicaps
        run: |
          flyctl ssh console -a copa-fedex-sucesores -C "python3 -c \"
          import sys;sys.path.insert(0,'/app')
          from src.ranking import recalcular_fecha
          recalcular_fecha('/data/torneo.db',11)
          import sqlite3
          c=sqlite3.connect('/data/torneo.db')
          c.row_factory=sqlite3.Row
          print('FINAL RESULTS FECHA 6:')
          for r in c.execute('SELECT rf.posicion,j.nombre,j.apellido,rf.score_gross,rf.handicap_aplicado,rf.score_neto,rf.puntos,rr.handicap_cancha FROM resultados_fecha rf JOIN jugadores j ON rf.jugador_id=j.id LEFT JOIN rondas rr ON rf.ronda_id=rr.id WHERE rf.fecha_torneo_id=11 ORDER BY rf.posicion').fetchall():
              m='OK' if r['handicap_aplicado']==r['handicap_cancha'] else 'CALC'
              print(f'  {r[\\\"posicion\\\"]} {r[\\\"nombre\\\"]} {r[\\\"apellido\\\"]} G:{r[\\\"score_gross\\\"]} HCP:{r[\\\"handicap_aplicado\\\"]} N:{r[\\\"score_neto\\\"]} Pts:{r[\\\"puntos\\\"]} Fed:{r[\\\"handicap_cancha\\\"]} {m}')
          \""
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Download and backup
        run: |
          flyctl ssh console -a copa-fedex-sucesores -C "cat /data/torneo.db" > data/torneo_prod.db
          python3 << 'PYEOF'
          import sqlite3, json
          conn = sqlite3.connect('data/torneo_prod.db')
          conn.row_factory = sqlite3.Row
          for tabla in ['jugadores', 'rondas', 'fechas_torneo', 'resultados_fecha', 'tabla_puntos']:
              rows = [dict(r) for r in conn.execute(f'SELECT * FROM {tabla}').fetchall()]
              with open(f'data/backup/{tabla}.json', 'w') as f:
                  json.dump(rows, f, indent=2, ensure_ascii=False)
              print(f'{tabla}: {len(rows)}')
          conn.close()
          PYEOF
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Commit backups
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git pull --rebase origin main || true
          git add data/backup/
          git diff --staged --quiet && echo "No changes" || (
            git commit -m "Backup DB - Fecha 6 liquidada (2026-03-28)"
            git push origin main
          )
