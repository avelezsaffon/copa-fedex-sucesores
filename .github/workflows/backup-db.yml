name: Re-sync and check March 21

on:
  push:
    paths:
      - '.github/workflows/backup-db.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Fresh sync and check Mar 21
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Wake up app
        run: |
          for i in 1 2 3 4 5; do
            curl -s -o /dev/null https://copa-fedex-sucesores.fly.dev/ && break || sleep 8
          done
          sleep 5

      - name: Sync all from federation
        run: |
          echo "Syncing all players..."
          curl -s -X POST https://copa-fedex-sucesores.fly.dev/api/sync/all --max-time 300 | python3 -m json.tool 2>/dev/null || true

      - name: Show March 21 rounds
        run: |
          flyctl ssh console -a copa-fedex-sucesores -C "python3 -c \"
          import sqlite3
          c=sqlite3.connect('/data/torneo.db')
          print('=== RONDAS MARZO 21 MANIZALES ===')
          for r in c.execute(\\\"SELECT r.id,r.jugador_id,j.nombre,j.apellido,r.fecha,r.score_gross,r.handicap_cancha,r.tarjeta_id FROM rondas r JOIN jugadores j ON r.jugador_id=j.id WHERE r.fecha='2026-03-21' AND r.club LIKE '%Manizales%' ORDER BY r.score_gross\\\").fetchall():
              print(f'  {r[2]} {r[3]}: G:{r[5]} HCP:{r[6]} tarjeta:{r[7]} (id:{r[0]})')
          print()
          print('=== TODAS RONDAS MARZO 19-24 MANIZALES ===')
          for f in ['2026-03-19','2026-03-20','2026-03-21','2026-03-22','2026-03-23','2026-03-24']:
              rows=c.execute(\\\"SELECT r.jugador_id,j.nombre,j.apellido,r.score_gross,r.id,r.tarjeta_id FROM rondas r JOIN jugadores j ON r.jugador_id=j.id WHERE r.fecha=? AND r.club LIKE '%Manizales%' ORDER BY r.jugador_id\\\", (f,)).fetchall()
              if rows:
                  print(f'{f} ({len(rows)} rondas):')
                  for r in rows: print(f'  {r[1]} {r[2]}: G:{r[3]} id:{r[4]}')
          \""
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Download and backup
        run: |
          flyctl ssh console -a copa-fedex-sucesores -C "cat /data/torneo.db" > data/torneo_prod.db
          python3 << 'PYEOF'
          import sqlite3, json
          conn = sqlite3.connect('data/torneo_prod.db')
          conn.row_factory = sqlite3.Row
          for tabla in ['jugadores', 'rondas', 'fechas_torneo', 'resultados_fecha', 'tabla_puntos']:
              rows = [dict(r) for r in conn.execute(f'SELECT * FROM {tabla}').fetchall()]
              with open(f'data/backup/{tabla}.json', 'w') as f:
                  json.dump(rows, f, indent=2, ensure_ascii=False)
              print(f'{tabla}: {len(rows)}')
          conn.close()
          PYEOF
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Commit backups
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git pull --rebase origin main || true
          git add data/backup/
          git diff --staged --quiet && echo "No changes" || (
            git commit -m "Fresh sync: check March 21 rounds from federation"
            git push origin main
          )
